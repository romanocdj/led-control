<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO 6-LED BLE Controller</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1, h2 {
            text-align: center;
            margin-top: 0;
        }
        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #ff4444;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.connected {
            background-color: #00c851;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-connect {
            background-color: var(--accent-color);
            color: #fff;
        }
        .btn-connect:hover { background-color: #008c95; }
        .btn-disconnect { background-color: #cc0000; color: #fff; }
        .btn-effect { background-color: #333; color: #fff; margin-bottom: 10px; }
        .btn-effect:hover { background-color: #444; }
        .btn-off { background-color: #555; color: #fff; margin-top: 15px; }
        .control-group {
            margin-bottom: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }
        .color-pickers {
            display: flex;
            gap: 10px;
        }
        .picker-box { flex: 1; }
        .log-box {
            background: #000;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            height: 80px;
            overflow-y: auto;
            font-size: 12px;
            color: #00ff00;
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>XIAO 6-LED Controller</h1>
    
    <div class="status-panel">
        <span>Status: <strong id="status-text">Disconnected</strong></span>
        <div id="status-dot" class="status-dot"></div>
    </div>

    <button id="btn-conn" class="btn-connect" onclick="connectDisconnect()">Connect to ESP32-C3</button>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <!-- Target LED Selector -->
    <div class="control-group">
        <label for="led-index">Target LED Selection</label>
        <select id="led-index">
            <option value="255">Apply to All LEDs</option>
            <option value="0">LED 1</option>
            <option value="1">LED 2</option>
            <option value="2">LED 3</option>
            <option value="3">LED 4</option>
            <option value="4">LED 5</option>
            <option value="5">LED 6</option>
        </select>
    </div>

    <!-- Color Configuration -->
    <div class="control-group">
        <div class="color-pickers">
            <div class="picker-box">
                <label>Color A Primary</label>
                <input type="color" id="colorA" value="#ff0000">
            </div>
            <div class="picker-box">
                <label>Color B (Fade Only)</label>
                <input type="color" id="colorB" value="#0000ff">
            </div>
        </div>
    </div>

    <!-- Speed -->
    <div class="control-group">
        <label id="lbl-speed">Effect Speed: 1000 ms</label>
        <input type="range" id="speed" min="50" max="3000" step="50" value="1000" oninput="updateSpeedLabel(this.value)">
    </div>

    <!-- Animation Commands -->
    <h2>Animations</h2>
    <button class="btn-effect" onclick="sendEffect('SOLID')">Solid Color</button>
    <button class="btn-effect" onclick="sendEffect('BREATHE')">Breathe</button>
    <button class="btn-effect" onclick="sendEffect('FADE')">Two-Color Fade</button>
    <button class="btn-effect" onclick="sendEffect('CANDLE')">Candle Flicker</button>
    <button class="btn-effect" onclick="sendEffect('BLINK')">Blink</button>
    <button class="btn-effect" onclick="sendEffect('STROBE')">Strobe</button>
    <button class="btn-effect" onclick="sendEffect('RAINBOW')">Rainbow Wave</button>
    
    <button class="btn-off" onclick="sendEffect('OFF')">Turn Selected Off</button>

    <div class="log-box" id="log">Console ready...</div>
</div>

<script>
    // GATT UUIDs matching the firmware
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;

    function log(message) {
        const consoleLog = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        consoleLog.innerText = `[${time}] ${message}\n` + consoleLog.innerText;
    }

    function updateSpeedLabel(val) {
        document.getElementById('lbl-speed').innerText = `Effect Speed: ${val} ms`;
    }

    async function connectDisconnect() {
        if (bleDevice && bleDevice.gatt.connected) {
            log("Disconnecting...");
            bleDevice.gatt.disconnect();
            return;
        }

        try {
            log("Searching for ESP32-C3-LED...");
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32-C3-LED' }],
                optionalServices: [SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            log("Connecting to GATT server...");
            const server = await bleDevice.gatt.connect();

            log("Getting Nordic UART service...");
            const service = await server.getPrimaryService(SERVICE_UUID);

            log("Getting RX characteristic...");
            rxCharacteristic = await service.getCharacteristic(RX_CHARACTERISTIC_UUID);

            document.getElementById('status-text').innerText = "Connected";
            document.getElementById('status-dot').classList.add('connected');
            document.getElementById('btn-conn').innerText = "Disconnect";
            document.getElementById('btn-conn').className = "btn-disconnect";

            log("Connected successfully!");
        } catch (error) {
            log("Error: " + error.message);
            console.error(error);
        }
    }

    function onDisconnected() {
        document.getElementById('status-text').innerText = "Disconnected";
        document.getElementById('status-dot').classList.remove('connected');
        document.getElementById('btn-conn').innerText = "Connect to ESP32-C3";
        document.getElementById('btn-conn').className = "btn-connect";
        rxCharacteristic = null;
        bleDevice = null;
        log("Device disconnected");
    }

    async function sendEffect(mode) {
        if (!rxCharacteristic) {
            log("Error: Not connected");
            return;
        }

        const ledSel = document.getElementById('led-index').value;
        const cA = document.getElementById('colorA').value;   // keeps the #
        const cB = document.getElementById('colorB').value;
        const speed = document.getElementById('speed').value;

        let commandStr = "";

        switch (mode) {
            case 'SOLID':
                commandStr = `SOLID:${ledSel}:${cA}`;
                break;
            case 'BREATHE':
                commandStr = `BREATHE:${ledSel}:${speed}:${cA}`;
                break;
            case 'FADE':
                commandStr = `FADE:${ledSel}:${speed}:${cA}:${cB}`;
                break;
            case 'CANDLE':
                commandStr = `CANDLE:${ledSel}:${speed}:${cA}`;
                break;
            case 'BLINK':
                commandStr = `BLINK:${ledSel}:${speed}:${cA}`;
                break;
            case 'STROBE':
                commandStr = `STROBE:${ledSel}:${speed}:${cA}`;
                break;
            case 'RAINBOW':
                commandStr = `RAINBOW:${ledSel}:${speed}`;
                break;
            case 'OFF':
                if (ledSel === "255") {
                    commandStr = "OFF";
                } else {
                    commandStr = `OFF:${ledSel}`;
                }
                break;
            default:
                log("Unknown mode");
                return;
        }

        try {
            const encoder = new TextEncoder();
            await rxCharacteristic.writeValue(encoder.encode(commandStr));
            log("Sent → " + commandStr);
        } catch (err) {
            log("Write failed: " + err.message);
        }
    }
</script>
</body>
</html>
