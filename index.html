<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO 6-LED BLE Controller</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1, h2 {
            text-align: center;
            margin-top: 0;
        }
        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #ff4444;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.connected {
            background-color: #00c851;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-connect {
            background-color: var(--accent-color);
            color: #fff;
        }
        .btn-connect:hover { background-color: #008c95; }
        .btn-disconnect { background-color: #cc0000; color: #fff; }
        .btn-effect { background-color: #333; color: #fff; margin-bottom: 10px; }
        .btn-effect:hover { background-color: #444; }
        .btn-off { background-color: #555; color: #fff; margin-top: 15px; }
        .control-group {
            margin-bottom: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }
        .color-pickers {
            display: flex;
            gap: 10px;
        }
        .picker-box { flex: 1; }
        .log-box {
            background: #000;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            height: 80px;
            overflow-y: auto;
            font-size: 12px;
            color: #00ff00;
